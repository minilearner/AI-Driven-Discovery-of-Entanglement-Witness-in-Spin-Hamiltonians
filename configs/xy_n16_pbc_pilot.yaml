master_seed: 20260810

dataset:
  num_samples: 500
  pilot_gate_approved: false
  minimum_beyond_all_two_rdm: 1

feature_schema:
  training_feature_names: data/n16_production_v1/feature_names.json

runtime:
  progress_every: 1

thermal_solver:
  chi_max: 128
  dt: 0.05
  svd_min: 1.0e-12
  max_sweeps: 2
  pbc: true

ground_solver:
  chi_max: 128
  svd_min: 1.0e-12
  max_sweeps: 30
  energy_tol: 1.0e-11
  pbc: true

field_convergence:
  epsilon_sequence: [1.0e-4, 1.0e-5, 1.0e-6, 1.0e-7]
  feature_tolerance: 1.0e-6

certification:
  tol_pt: 1.0e-9
  tol_ccnr: 1.0e-8
  tol_energy: 1.0e-9
  K3: 50
  K4: 50

thermal_convergence_audit:
  fraction: 0.05
  num_points: 3
  stop_on_first_failure: true
  temperature_min: 0.5
  tighter_dt_factor: 0.5
  tighter_chi_factor: 2
  tighter_svd_min_factor: 0.1
  feature_tolerance: 1.0e-6
