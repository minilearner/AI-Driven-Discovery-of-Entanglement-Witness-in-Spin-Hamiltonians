master_seed: 20260811
state_backend: finite_free_fermion_exact
exact_backend_validation_report: data/xy_n16_pbc_v1/exact_backend_validation.json

dataset:
  num_samples: 500
  pilot_gate_approved: false
  minimum_beyond_all_two_rdm: 1
  include_ordered_t0: false

feature_schema:
  training_feature_names: data/n16_production_v1/feature_names.json

runtime:
  progress_every: 1

ground_solver:
  chi_max: 128
  svd_min: 1.0e-12
  max_sweeps: 30
  energy_tol: 1.0e-11
  pbc: true

field_convergence:
  epsilon_sequence: [1.0e-4, 1.0e-5, 1.0e-6, 1.0e-7]
  feature_tolerance: 1.0e-6

certification:
  tol_pt: 1.0e-9
  tol_ccnr: 1.0e-9
  tol_energy: 1.0e-9
  K3: all
  K4: all
