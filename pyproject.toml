[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entnet-spin-entanglement"
version = "0.1.0"
description = "EntNet spin-chain entanglement detection and paper reproduction"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "h5py>=3.10",
    "PyYAML>=6.0",
    "psutil>=5.9",
    "scipy>=1.10",
    "scikit-learn>=1.5,<2",
    "pandas>=1.5",
    "matplotlib>=3.7",
    "pfapack>=1.1.1",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

