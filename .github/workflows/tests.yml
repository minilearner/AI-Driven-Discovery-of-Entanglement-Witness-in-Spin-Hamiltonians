name: Python tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test
        run: python -m pytest -q tests
      - name: Frozen-model inference example
        run: python scripts/infer_example.py
      - name: Physical state to score example
        run: python scripts/physical_example.py
      - name: Small HDF5 benchmark and metric check
        run: |
          python scripts/evaluate_final.py --dataset tests/fixtures/physical_smoke_n16.h5 --output outputs/ci_smoke_evaluation.json
          python -c "import json; r=json.load(open('outputs/ci_smoke_evaluation.json')); assert r['rows']==24 and r['known_rows']==24 and r['AUROC']==1.0 and r['E2_recall']==1.0 and r['TNR']==1.0 and r['threshold']==0.5"
      - name: One-epoch final training route smoke
        run: python scripts/smoke_train_dv1.py
